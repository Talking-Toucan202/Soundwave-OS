<script>
    const music = document.getElementById("bgMusic");

function fadeOutMusic(callback){

    let fade = setInterval(()=>{

        if(music.volume > 0.03){

            music.volume -= 0.03;

        }else{

            clearInterval(fade);

            music.pause();

            if(callback) callback();

        }

    },50);

}
</script>
