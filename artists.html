    <style>

.topnav {
  display: flex;
  justify-content: center;
  gap: 15px;
  padding: 15px;
  background: rgb(255, 255, 255);
  position: sticky;
  top: 0;
  z-index: 10;
  
}
.topnav a {
  text-decoration: underline;
  color: #4e4e4e;
  font-size: 14px;
  font-weight: 100;
  letter-spacing: 1px;
  transition: 0.3s;
}
.topnav a:hover {
  color:#5B3C77;
  transform: scale(1.2);
}
        /* RESET */
        * {
          margin: 0;
          padding: 0;
          box-sizing: border-box;
        }
        
        body {
          background: black;
          font-family: sans-serif;
        }
        
        /* INTRO */
        .intro img {
          width: 100%;
          height: 60vh;
          object-fit: cover;
          display: block;
        }
        
        /* GRID */
        .grid {
          display: grid;
          grid-template-columns: repeat(4, 1fr);
          grid-template-rows: repeat(3, 1fr);
          gap: 0;
          width: 100%;
        }
        
        /* TILE */
        .tile {
          position: relative;
          width: 100%;
          overflow: hidden;
          aspect-ratio: 1/1;
          cursor: pointer;
        }
        
/* IMAGE */
.tile .bg {
width: 100%;
height: 100%;
object-fit:contain;
background: black;
transition: filter 0.5s ease, transform 0.5s ease;
}
        
/* Blur for background image */
 .tile:hover .bg {
  filter: blur(6px) brightness(0.7);
 transform: scale(1.05);
}
        
 .overlay {
  position: absolute;
  inset: 0;
 display: flex;
align-items: center;
 justify-content: center;
}
    
.signature {
  width: 100%;
  max-width: 420px;
  opacity: 0;
  transform: scale(0.95) translateY(10px);
  filter: blur(6px);
  transition:
    opacity 0.8s ease,
    transform 1s ease,
    filter 1s ease;
  clip-path: inset(0 100% 0 0);
}

/* HOVER EFFECT */
.tile:hover .signature {
  opacity: 1;
  transform: scale(1) translateY(0);
  filter: blur(0);
  clip-path: inset(0 0 0 0);
  transition:
    clip-path 2.5s ease,
    opacity 0.8s ease,
    transform 1s ease,
    filter 1s ease;
}

 </style>
</head>

<script>
let currentAudio = null;
let isHovering = false;

const tiles = document.querySelectorAll(".tile");

tiles.forEach(tile => {
  const audio = new Audio(tile.dataset.audio);
  audio.preload = "auto";

  tile.addEventListener("mouseenter", () => {
    isHovering = true;

    // stop previous audio if switching tiles
    if (currentAudio && currentAudio !== audio) {
      currentAudio.pause();
      currentAudio.currentTime = 0;
    }

    audio.currentTime = 0;
    audio.play();
    currentAudio = audio;
  });

  tile.addEventListener("mouseleave", () => {
    isHovering = false;

    audio.pause();
    audio.currentTime = 0;
  });

  audio.addEventListener("ended", () => {
    if (isHovering) {
      audio.currentTime = 0;
      audio.play();
    }
  });
});
</script>
