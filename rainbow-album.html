<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rainbow - Selection Page</title>

<style>
    body {
        font-family:Arial, Helvetica, sans-serif;
    font-weight: 100;
    }
    
    /* Hidden Side Navigation */
    .sidenav {
      height: 100%;
      width: 250px;
      position: fixed;
      z-index: 2;
      top: 0;
      left: -250px;
      background-color: #000000;
      overflow-x: hidden;
      padding-top: 75px;
      transition: 0.4s;
    }
    
    .sidenav a {
      padding: 8px 8px 8px 32px;
      text-decoration: none;
      font-size: 25px;
      color: #ffffff;
      display: block;
    }
    
    .sidenav a:hover {
      color: #bb8cf0;
    }
    
    .sidenav .closebtn {
      position: absolute;
      top: 10px;
      right: 20px;
      font-size: 36px;
    }
    
    
    /* Three Line Menu Icon */
    .menu-icon {
      position: fixed;
      top: 30px;
      left: 30px;
      z-index: 3;
      cursor: pointer;
      width: 35px;
    }
    
    .menu-icon div {
      height: 3px;
      width: 25px;
      background-color: #ffa1ec;
      margin: 7px 0;
      border-radius: 20px;
    }
    
    
    /* Mobile Adjustment */
    @media screen and (max-height: 450px) {
      .sidenav a {
        font-size: 18px;
      }
    }
    
    </style>
    
    
    <!-- Side Navigation Menu -->
    <div id="mySidenav" class="sidenav">
    
      <a href="javascript:void(0)" class="closebtn" onclick="closeNav()">×</a>
      <a href="mc-artist-page.html#slider-page-1"> ↪ Return To: Mariah Carey Artist Page</a>
      <a href="index.html">Lounge</a>
      <a href="artists.html">Artist Catalog</a>
      <a href="tours.html">Tours</a>
      <a href="#">Fashion</a>
      <a href="#">The Personal Vault</a>
    
    </div>
    
    
    <!-- Three Lines in Corner -->
    <div class="menu-icon" onclick="openNav()">
      <div></div>
      <div></div>
      <div></div>
    </div>
    
    
    <script>
    
    function openNav() {
      document.getElementById("mySidenav").style.left = "0";
    }
    
    
    function closeNav() {
      document.getElementById("mySidenav").style.left = "-250px";
    }
    
    </script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#E4C7E3;
    font-family:Arial, Helvetica, sans-serif;
    font-weight: 100;
}

/* MAIN CONTAINER */

.selection-page{
    position:relative;
    width:100vw;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

/* BACKGROUND IMAGE */

.hero-image{
    width:100%;
    height:100%;
    object-fit:contain;
    user-select:none;
    pointer-events:none;
}

/* HOTSPOTS */

.hotspot{
    position:absolute;
    display:flex;
    justify-content:center;
    align-items:center;
    text-decoration:none;
    color:white;
    font-size:1.2rem;
    font-weight: 100;
    letter-spacing:4px;
    text-transform:uppercase;
    transition:.3s;
}

/* TEST BUTTONS */

.secret-btn{
position:absolute;
width:126px;
height:60px;
color:rgb(255, 0, 0);
border-radius:0%;
display:flex;
justify-content:center;
align-items:center;
font-size:20px;
cursor:pointer;
z-index:999;
}

/* CHANGE THESE POSITIONS TO WHERE YOU WANT THE BUTTONS */

#secret1{

top:500px;
left:289px;

}


#secret2{
top:485px;
left:1030px; 
}


#secret3{

top:640px;
left:1200px;

}

/* MODAL */

.modal{
display:none;
position:fixed;
inset:0;
justify-content:center;
align-items:center;
z-index:1000;
background-color: #0000005e;
}

.modal-box{
position:relative;
}

.close{
position:absolute;
right:-40px;
top:-40px;
color:rgb(246, 246, 246);
font-size:40px;
cursor:pointer;
}

.hotspot:hover{
    color:#ff0084;
    transform:scale(1.08);
}

/*  BOTTOM MENU - Adjust these until they line up */

.songs{
    left:14%;
    bottom:6%;
    width:10%;
    height:2%;
}

.photos{
    left:28%;
    bottom:6%;
    width:12%;
    height:2%;
}

.videos{
    left:45%;
    bottom:6%;
    width:12%;
    height:2%;
}

.links{
    left:63%;
    bottom:6%;
    width:10%;
    height:2%;
}

.credits{
    left:77%;
    bottom:6%;
    width:12%;
    height:2%;
}

</style>
</head>

<style>
    body{
    opacity:1;
    transition:opacity .8s ease;
}

body.loaded{
    opacity: 1;
}

body.fade-out{
    opacity: 0;
}
</style>

<body>
<div class="selection-page">

    <!-- Background Music -->
<audio id="bgMusic" autoplay loop>
    <source src="heartbreaker.mp3" type="audio/mpeg">
</audio>

<script>
    // Target the background music
    const bgMusic = document.getElementById("bgMusic");

    // Set background music volume to 20%
    bgMusic.volume = 0.05;
</script>

    <!-- Background -->
    <img src="rainbow-album.png"
         alt="Rainbow Selection Page"
         class="hero-image">

         <!-- Hidden Easter Egg Buttons -->

         <div class="secret-btn" id="secret1"></div>
         <div class="secret-btn" id="secret2"></div>
         <div class="secret-btn" id="secret3"></div>

<!-- Video Modal -->

<div id="videoModal" class="modal">

    <div class="modal-box">

        <span class="close">&times;</span>

        <iframe 
            id="Video"
            width="900"
            height="506"
            src=""
            frameborder="0"
            allow="autoplay; encrypted-media"
            allowfullscreen>
        </iframe>

    </div>

</div>
    <!-- Bottom Menu -->

    <a href="##" class="hotspot songs">
        TRACKLIST
    </a>

    <a href="#" class="hotspot photos">
        VIDEOS
    </a>

    <a href="#" class="hotspot videos">
        PHOTOS
    </a>

    <a href="#" class="hotspot links">
        ANNOTATIONS
    </a>

    <a href="#" class="hotspot credits">
        THE STORY
    </a>

</div>
</body>

<script>

    let clicks = 0;
    
    
    const modal = document.getElementById("videoModal");
    const video = document.getElementById("Video");
    
    
    // FIRST BUTTON
    
    document.getElementById("secret1").onclick=function(){
    
        if(clicks === 0){
    
            clicks = 1;
    
            console.log("First hidden spot found!");
    
        }else{
    
            clicks = 0;
    
        }
    
    };
    
    
    // SECOND BUTTON
    
    document.getElementById("secret2").onclick=function(){
    
        if(clicks === 1){
    
            clicks = 2;
    
            console.log("Second hidden spot found!");
    
        }else{
    
            clicks = 0;
    
        }
    
    };
    
    
    // THIRD BUTTON
    
    document.getElementById("secret3").onclick=function(){
    
        if(clicks === 2){
    
            console.log("Secret unlocked!");
    
            modal.style.display="flex";
    
            video.src="Mariah Carey - Making the video.mp4";
    
    
            clicks=0;
    
        }else{
    
            clicks=0;
    
        }
    
    };
    
    
    // CLOSE BUTTON
    
    document.querySelector(".close").onclick=function(){
    
        modal.style.display="none";
    
        video.src="";
    
    };
    
    
    // CLICK OUTSIDE TO CLOSE
    
    window.onclick=function(event){
    
        if(event.target == modal){
    
            modal.style.display="none";
    
            video.src="";
    
        }
    
    };
    
    
    </script>
</html>
