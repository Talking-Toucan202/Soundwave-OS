    /* Hidden Side Navigation */
    .sidenav {
      height: 100%;
      width: 250px;
      position: fixed;
      z-index: 2;

      left: -250px;

      transition: 0.4s;
    }

      right: 20px;
      font-size: 36px;
    }
    
    
    /* Three Line Menu Icon */
    .menu-icon {
      position: fixed;
      top: 30px;
      left: 30px;
      z-index: 3;
      cursor: pointer;
      width: 35px;
    }
    
    .menu-icon div {
      height: 3px;
      width: 25px;
      background-color:#CE1304;
      margin: 7px 0;
      border-radius: 20px;
    }
    
    
    /* Mobile Adjustment */
    @media screen and (max-height: 450px) {
      .sidenav a {
        font-size: 18px;
      }
    }
